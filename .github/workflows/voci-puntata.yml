name: Puntata di prova della Radio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  puntata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts numpy scipy
      - name: Genera la puntata
        run: |
          python voci-src/puntata.py en-US-AndrewMultilingualNeural "" 2>&1 | tee voci-src/puntata-log.txt
          python voci-src/monta.py voci-src/_voci.mp3 lab/voci/puntata.mp3 2>&1 | tee -a voci-src/puntata-log.txt
        continue-on-error: true
      - name: Pubblica la puntata
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lab/voci voci-src/puntata-log.txt
          git commit -m "Puntata di prova della Radio" || echo "nessuna modifica"
          git pull --rebase -q
          git push
