name: Puntata di prova della Radio
on:
  workflow_dispatch:
    inputs:
      modello:
        description: Modello Gemini preferito (vuoto = Pro, poi Lite)
        required: false
        default: ''
      solo_gemini:
        description: 1 = pubblica solo se tutte le battute sono Gemini; 0 = ammette Chirp/edge
        required: false
        default: '1'
permissions:
  contents: write
jobs:
  puntata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install edge-tts numpy scipy google-genai google-auth requests
      - name: Genera la puntata
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_JSON: ${{ secrets.GOOGLE_TTS_JSON }}
          MODELLO: ${{ github.event.inputs.modello }}
          SOLO_GEMINI: ${{ github.event.inputs.solo_gemini || '1' }}
        id: gen
        run: |
          set -o pipefail
          python voci-src/puntata.py en-US-AndrewMultilingualNeural "" 2>&1 | tee voci-src/puntata-log.txt
          python voci-src/monta.py voci-src/_voci.mp3 lab/voci/puntata.mp3 2>&1 | tee -a voci-src/puntata-log.txt
        continue-on-error: true
      - name: Pubblica la puntata
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add voci-src/puntata-log.txt
          if [ "${{ steps.gen.outcome }}" = "success" ]; then git add lab/voci; else echo "puntata non pubblicata: si tiene quella precedente"; fi
          git commit -m "Puntata di prova della Radio" || echo "nessuna modifica"
          git pull --rebase -q
          git push
