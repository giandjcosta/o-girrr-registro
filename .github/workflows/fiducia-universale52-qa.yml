name: Fiducia universale 5.2 QA
on:
  push:
    paths:
      - 'lab/index.html'
      - 'anteprima/**'
      - 'prove/collaudo_fiducia_universale52.js'
      - '.github/workflows/fiducia-universale52-qa.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ricostruisci Anteprima 5.2
        run: python3 anteprima/build.py
      - name: Verifica Big Emergenti Outsider e premi sponsor
        run: node prove/collaudo_fiducia_universale52.js
