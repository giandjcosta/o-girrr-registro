name: "ChatGPT: QA Edizione speciale 6.5"
on:
  pull_request:
    branches:
      - main
    paths:
      - "voci-src/copione.py"
      - "rilascio/video/remotion/**"
      - "rilascio/curva-os/**"
      - "lab/integrata-62/**/curva-banca.js"
      - "prove/v65/prova_edizione_speciale.js"
      - "prove/v65/prova_radio_speciale.py"
      - ".github/workflows/chatgpt-65-edizione-speciale-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codice-senza-servizi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Controlla la banca Curva con tre date e il codice Radio/Video
        run: node prove/v65/prova_edizione_speciale.js
      - name: Controlla la battuta Radio 7/8 con campione locale e senza Gemini
        run: python3 prove/v65/prova_radio_speciale.py

  fotogrammi-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: reg }
      - uses: actions/checkout@v4
        with:
          repository: giandjcosta/o-fant-a-girrr
          ref: gh-pages
          path: site
      - name: Foto originale con licenza, dalla skin di Claude non ancora pubblicata
        uses: actions/checkout@v4
        with:
          repository: giandjcosta/o-girrr-registro
          ref: claude/totogirrr-ui-responsive-b2pgee
          path: tema
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Prepara foto senza intervenire sul sito vero
        run: |
          mkdir -p reg/temi/notte-tropicale
          cp tema/temi/notte-tropicale/miami-palme.jpg reg/temi/notte-tropicale/miami-palme.jpg
      - name: Installa strumenti grafici Remotion, non Gemini
        run: |
          cd reg/rilascio/video/remotion
          npm i --no-audit --no-fund remotion@4.0.300 @remotion/cli@4.0.300 @remotion/renderer@4.0.300 @remotion/bundler@4.0.300 react@18.3.1 react-dom@18.3.1
      - name: Crea copertina, classifica, chiusura della 7 con forzatura speciale
        run: |
          cd reg/rilascio/video/remotion
          SITO="$GITHUB_WORKSPACE/site/" GIORNATA=7 SKIN=notte-tropicale QA_NO_RPC=1 SOLO_FOTOGRAMMI=1 SCREENSHOT_DIR="$GITHUB_WORKSPACE/qa/video-speciale" node render.mjs
      - name: Stesse scene della 7 con skin spenta
        run: |
          cd reg/rilascio/video/remotion
          SITO="$GITHUB_WORKSPACE/site/" GIORNATA=7 SKIN=off QA_NO_RPC=1 SOLO_FOTOGRAMMI=1 SCREENSHOT_DIR="$GITHUB_WORKSPACE/qa/video-ordinario" node render.mjs
      - name: Allega i fotogrammi e le durate alla PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-65-radio-video-curva-qa
          path: qa/
          if-no-files-found: warn
          retention-days: 14
