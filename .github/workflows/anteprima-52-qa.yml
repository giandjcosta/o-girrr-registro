name: Anteprima 5.2 QA
on:
  push:
    paths:
      - 'lab/index.html'
      - 'anteprima/**'
      - 'prove/collaudo_anteprima_52.py'
      - '.github/workflows/anteprima-52-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Genera Anteprima 5.2 dalla sorgente Lab
        run: python3 anteprima/build.py
      - name: Controlla componenti 5.2
        run: python3 prove/collaudo_anteprima_52.py
