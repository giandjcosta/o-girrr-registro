name: Fiducia 5.2 Browser QA
on:
  # Claude, 16 novembre 2026 (Gianluca: «i check superflui non si possono eliminare?»): collaudo di una versione passata,
  # solo a mano (Actions › questo workflow › Run workflow). Prima partiva da solo su push e Pull Request.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Anteprima build
        run: python3 anteprima/build.py
      - name: Install Playwright browsers
        run: |
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Serve Lab
        run: |
          python3 -m http.server 8765 > /tmp/girrr-52-http.log 2>&1 &
          sleep 2
      - name: Test animated trust gauge
        run: python3 prove/collaudo_fiducia52_browser.py
