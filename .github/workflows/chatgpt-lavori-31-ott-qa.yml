name: ChatGPT - Lavori 31 ottobre QA
on:
  push:
    branches:
      - chatgpt/lavori-31-ottobre
    paths:
      - .github/workflows/chatgpt-lavori-31-ott-qa.yml
permissions:
  contents: write
jobs:
  anteprima-e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rigenera le due anteprime dal Lab
        run: python3 anteprima/build.py
      - name: Salva solo le pagine generate sul ramo di lavoro
        run: |
          test "$GITHUB_REF" = "refs/heads/chatgpt/lavori-31-ottobre"
          git add anteprima/index.html anteprima/attuale.html
          if ! git diff --cached --quiet; then
            git config user.name "ChatGPT"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ChatGPT: rigenera le anteprime dopo le modifiche del Lab"
            git push origin HEAD:chatgpt/lavori-31-ottobre
          fi
      - name: Collaudo Anteprima 5.2
        run: python3 prove/collaudo_anteprima_52.py
      - name: Collaudo Totogirrr milestone
        run: node prove/collaudo_preview52_totogirrr_milestone.js
      - name: Collaudo Fiducia universale
        run: node prove/collaudo_fiducia_universale52.js
      - name: Prova Moviola in rete simulata
        run: python3 prove/prova_moviola.py
      - name: Installa Chromium per verifica visiva
        run: |
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install chromium
      - name: Avvia il Lab locale
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lab-server.log 2>&1 &
          sleep 2
      - name: Browser 320px, console e Curva in memoria
        run: python3 prove/collaudo_chatgpt_31_browser.py
      - name: Screenshot del browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-31-ottobre-screenshot
          path: qa_artifacts/*.png
          if-no-files-found: ignore
