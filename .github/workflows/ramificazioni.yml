name: ChatGPT - Aggiornamento delle ramificazioni
on:
  schedule:
    # Registrazione rinnovata; quattro controlli all’ora, lontano dal minuto zero.
    - cron: '8,23,38,53 * * * *'
  push:
    branches-ignore: [chatgpt/dati-ramificazioni]
  pull_request_target:
    # Legge solo metadati; checkout esplicito del main, mai del codice della PR.
    types: [opened, reopened, closed, synchronize, edited, ready_for_review, converted_to_draft]
  create:
  delete:
  workflow_run:
    # Se GitHub ritarda i cron, aggiorna anche dopo i lavori e gli allineamenti.
    # Il collector non è in questo elenco: il feed tecnico non crea un ciclo.
    workflows:
      - 'ChatGPT - Registro Chromium WebKit Firefox'
      - 'ChatGPT - Integrazione Anteprima 5.5'
      - 'Claude - Collaudo 5.5 telefono e PC (Chromium e WebKit)'
      - 'ChatGPT - Allineamento automatico del Registro'
    types: [requested, completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ramificazioni
  cancel-in-progress: false
jobs:
  aggiorna:
    # Rami e PR di qualsiasi base: esegue sempre e soltanto codice del main.
    # Esclude creazione/cancellazione del feed tecnico e gli eventi sui tag.
    # Scrive sul ramo tecnico; non pubblica GitHub Pages.
    if: >-
      (github.event_name != 'create' && github.event_name != 'delete') ||
      (github.event.ref_type == 'branch' && github.event.ref != 'chatgpt/dati-ramificazioni')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leggi entrambi i repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ramificazioni.py --cache "$RUNNER_TEMP/grafi-git" --output "$RUNNER_TEMP/ramificazioni-dati.json"
      - name: Claude - Dati dei tre disegni (Albero, Linea del tempo, Ventaglio)
        # rami.html, in cima a Ramificazioni (Gianluca, 14 novembre 2026). Copie Git senza file, solo storia e rami.
        # Se non riesce, la mappa di sopra si aggiorna lo stesso.
        continue-on-error: true
        run: |
          git clone -q --no-checkout --filter=blob:none https://github.com/giandjcosta/o-fant-a-girrr.git "$RUNNER_TEMP/rami-sito"
          git clone -q --no-checkout --filter=blob:none https://github.com/giandjcosta/o-girrr-registro.git "$RUNNER_TEMP/rami-registro"
          python3 rami_genera.py "$RUNNER_TEMP/rami-dati.json" "$RUNNER_TEMP/rami-sito" "$RUNNER_TEMP/rami-registro"
      - name: Conserva i dati su un ramo tecnico, senza modificare il sito
        env:
          SNAPSHOT: ${{ runner.temp }}/ramificazioni-dati.json
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          destinazione="$RUNNER_TEMP/mappa-pubblica"
          if git ls-remote --exit-code origin refs/heads/chatgpt/dati-ramificazioni >/dev/null; then
            git fetch origin chatgpt/dati-ramificazioni
            git worktree add -b chatgpt/mappa-temporanea "$destinazione" FETCH_HEAD
          else
            git worktree add --detach "$destinazione"
            git -C "$destinazione" switch --orphan chatgpt/mappa-temporanea
          fi
          cp "$SNAPSHOT" "$destinazione/ramificazioni-dati.json"
          git -C "$destinazione" add -- ramificazioni-dati.json
          if [ -s "$RUNNER_TEMP/rami-dati.json" ]; then cp "$RUNNER_TEMP/rami-dati.json" "$destinazione/rami-dati.json"; git -C "$destinazione" add -- rami-dati.json; fi
          if git -C "$destinazione" diff --cached --quiet; then exit 0; fi
          git -C "$destinazione" commit -m 'ChatGPT: aggiorna automaticamente la mappa dei rami'
          git -C "$destinazione" push origin HEAD:refs/heads/chatgpt/dati-ramificazioni
