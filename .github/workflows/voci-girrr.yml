name: Prova pronuncia Girrr
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python voci-src/prova_girrr.py 2>&1 | tee voci-src/girrr-log.txt
        continue-on-error: true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lab voci-src/girrr-log.txt
          git commit -m "Prova pronuncia Girrr" || echo "nessuna modifica"
          git pull --rebase -q
          git push
