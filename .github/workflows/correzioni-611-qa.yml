name: ChatGPT - Carriera e Curva 6.1.1
on:
  pull_request:
    branches: [main]
    paths: ['rilascio/r611/**', 'rilascio/stagione/**', 'rilascio/curva-os/**', 'prove/prova_611.js', 'lab/novita-6-1-1.html', '.github/workflows/correzioni-611-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        motore: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: giandjcosta/o-fant-a-girrr
          ref: a6fcf03c50da1fd762e49e1096e5e2146a4a7f54
          path: qa-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser reale e certificati Firefox
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps ${{ matrix.motore }}
          sudo apt-get install -y libnss3-tools
          mkdir -p "$RUNNER_TEMP/firefox-ca"
          certutil -N --empty-password -d "sql:$RUNNER_TEMP/firefox-ca"
          for cert in /usr/local/share/ca-certificates/*.crt; do
            [ -f "$cert" ] || continue
            certutil -A -d "sql:$RUNNER_TEMP/firefox-ca" -n "$(basename "$cert")" -t 'C,,' -i "$cert"
          done
      - name: Prepara solo la copia, mai il sito vero
        run: |
          python3 rilascio/r611/applica.py qa-site
          mkdir -p "$RUNNER_TEMP/web"
          ln -s "$GITHUB_WORKSPACE/qa-site" "$RUNNER_TEMP/web/o-fant-a-girrr"
          python3 prove/server_range.py --directory "$RUNNER_TEMP/web" --port 8890 > "$RUNNER_TEMP/611-server.log" 2>&1 &
      - name: Sedici schermi, due grafiche, bozze e movimenti
        env:
          MOTORE: ${{ matrix.motore }}
          FIREFOX_CERT_PROFILE: ${{ runner.temp }}/firefox-ca
          FOTO: qa-artifacts
        run: node prove/prova_611.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correzioni-611-${{ matrix.motore }}
          path: qa-artifacts/
