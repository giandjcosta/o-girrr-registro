name: ChatGPT - Allineamento automatico del Registro
on:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'anteprima/**'
      - 'rilascio/versioni/**'
      - 'sincronizza.py'
      - 'changelog.py'
      - '.github/workflows/sincronizza-registro.yml'
  schedule:
    # Controllo ogni 6 ore: si sincronizza solo se dall'ultima sincronizzazione
    # sono passati 7 giorni, o se sul sito c'è una versione nuova (regola di Gianluca).
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sincronizza-registro
  cancel-in-progress: false
jobs:
  controlla:
    # Claude: decide se serve sincronizzare (Gianluca, 12 novembre 2026: ogni 7 giorni dall'ultima sincronizzazione).
    runs-on: ubuntu-latest
    outputs:
      serve: ${{ steps.decidi.outputs.serve }}
    steps:
      - id: decidi
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo 'serve=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          # Versione nuova sul sito: si sincronizza subito.
          sito=$(curl -fsSL https://raw.githubusercontent.com/giandjcosta/o-fant-a-girrr/gh-pages/versioni.json | jq -r '.versioni[0].v' || echo '')
          reg=$(curl -fsSL "https://raw.githubusercontent.com/$REPO/main/registro-stato.json" | jq -r '.versione' || echo '')
          if [ -n "$sito" ] && [ "$sito" != "$reg" ]; then
            echo "Versione nuova sul sito: $sito (registro $reg)"; echo 'serve=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Ultima sincronizzazione: l'ultima esecuzione in cui il passo «allinea» è riuscito.
          ultima=''
          for id in $(gh api "repos/$REPO/actions/workflows/sincronizza-registro.yml/runs?status=success&per_page=100" --jq '.workflow_runs[].id'); do
            [ "$id" = "$RUN" ] && continue
            fine=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.name=="allinea" and .conclusion=="success") | .completed_at' | head -1)
            if [ -n "$fine" ]; then ultima="$fine"; break; fi
          done
          if [ -z "$ultima" ]; then echo 'Nessuna sincronizzazione trovata'; echo 'serve=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          ore=$(( ( $(date -u +%s) - $(date -u -d "$ultima" +%s) ) / 3600 ))
          echo "Ultima sincronizzazione: $ultima ($ore ore fa)"
          # 7 giorni = 168 ore; 3 ore di margine per il controllo ogni 6 ore.
          if [ "$ore" -ge 165 ]; then echo 'serve=true' >> "$GITHUB_OUTPUT"; else echo 'serve=false' >> "$GITHUB_OUTPUT"; fi
  allinea:
    needs: controlla
    if: needs.controlla.outputs.serve == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: giandjcosta/o-fant-a-girrr
          ref: gh-pages
          path: .sito-pubblicato
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genera copia pubblicata, archivio, changelog e Anteprima
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 sincronizza.py --sito .sito-pubblicato
          python3 changelog.py
          python3 anteprima/build.py
          python3 prove/prova_sincronizzazione.py
          python3 prove/prova_cambio_versione_registro.py
      - name: Salva solo i file generati, senza sovrascrivere lavori concorrenti
        id: salva
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add -- anteprima/pubblicata/ anteprima/storica55.html anteprima/index.html anteprima/attuale.html anteprima/5.5/ anteprima/home-lega.html anteprima/home-stadio.html anteprima/tabellone-lega.html anteprima/tabellone-stadio.html anteprima/campo.html ufficiale/index.html archivio.html registro-stato.json index.html aggiornamenti.html rilascio/versioni/versioni.json ufficiale/src/sito/versioni.json README.md
          echo 'cambiato=false' >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ChatGPT: Registro allineato automaticamente al sito e al Laboratorio'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'cambiato=true' >> "$GITHUB_OUTPUT"
      - name: Prepara sito del Registro (senza checkout esterno)
        if: steps.salva.outputs.cambiato == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/pagine-registro"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pagine-registro"
      - uses: actions/upload-pages-artifact@v3
        if: steps.salva.outputs.cambiato == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: ${{ runner.temp }}/pagine-registro
      - uses: actions/deploy-pages@v4
        if: steps.salva.outputs.cambiato == 'true' || github.event_name == 'workflow_dispatch'
