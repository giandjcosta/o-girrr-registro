name: Prova voci Chirp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python -u voci-src/prova_chirp.py 2>&1 | tee voci-src/chirp-log.txt
        continue-on-error: true
        env:
          GOOGLE_TTS_JSON: ${{ secrets.GOOGLE_TTS_JSON }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lab voci-src/chirp-log.txt
          git commit -m "Prova voci Chirp" || echo "nessuna modifica"
          git pull --rebase -q
          git push
