name: Sonda Gemini
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai faster-whisper numpy scipy
      - run: python -u voci-src/sonda_gemini.py 2>&1 | tee voci-src/sonda-log.txt
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add voci-src/sonda-log.txt
          git commit -m "Sonda Gemini: risultato" || echo nulla
          git pull --rebase -q
          git push
