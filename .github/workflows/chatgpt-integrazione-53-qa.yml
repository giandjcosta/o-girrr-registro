name: ChatGPT - Integrazione Anteprima 5.3
on:
  push:
    branches: [chatgpt/integrazione-ui-campo-cronache]
  pull_request:
    branches: [chatgpt/lavori-31-ottobre]
permissions:
  contents: read
jobs:
  percorsi-e-cronache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build riproducibile e collaudi
        run: |
          python3 anteprima/build.py
          git diff --exit-code -- anteprima/
          python3 prove/collaudo_anteprima_52.py
          node prove/collaudo_preview52_totogirrr_milestone.js
          node prove/collaudo_fiducia_universale52.js
          python3 prove/prova_moviola.py
          python3 prove/prova_zone_classifica.py
          python3 prove/prova_cronache_integrate.py
      - name: Browser
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/anteprima-server.log 2>&1 &
      - name: Navigazione vera, telefono tablet PC
        run: |
          python3 prove/prova_navigazione_53.py
          python3 prove/prova_tabellone_campo_browser.py
          python3 prove/prova_giornale_cronaca_pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteprima-53-percorsi-e-pdf
          path: |
            qa_artifacts/*.png
            qa_artifacts/percorsi-53.json
            qa_artifacts/pdf-cronaca-esito.json
            qa_artifacts/cronaca-giornale-prova.pdf
