name: Prova emozioni Gemini
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install google-genai numpy
      - run: python -u voci-src/prova_emozioni.py 2>&1 | tee voci-src/emozioni-log.txt
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add lab voci-src/emozioni-log.txt
          git commit -m "Prova emozioni Gemini" || echo nulla
          git pull --rebase -q
          git push
