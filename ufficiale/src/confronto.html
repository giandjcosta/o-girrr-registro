<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>O Girrr · Anteprima 5.2</title>
<style>
html{--bh:46px}html,body{margin:0;height:100%;background:#141d3d;font-family:Inter,system-ui,-apple-system,sans-serif}
.bar{position:fixed;top:0;left:0;right:0;height:var(--bh);padding:0 12px;display:flex;align-items:center;gap:10px;background:#0f1630;border-bottom:1px solid rgba(255,255,255,.14);z-index:5;padding-top:env(safe-area-inset-top,0)}
.bar a{color:#ffd166;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:4px;margin-right:auto;min-width:0;overflow-x:auto;scrollbar-width:none}.bar nav::-webkit-scrollbar{display:none}.bar nav a{padding:6px 10px;border-radius:99px;font-size:11px;color:#fbf6ec;opacity:.7}.bar nav a.on{background:#d62839;opacity:1}.bar b{color:#fbf6ec;font-weight:900;font-size:13px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;align-items:center;gap:8px;color:#fbf6ec;font-weight:800;font-size:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sw span{opacity:.55;transition:opacity .25s}.sw span.on{opacity:1}
.tg{position:relative;width:52px;height:30px;border-radius:999px;background:#1d2a52;border:1px solid rgba(255,255,255,.28);padding:0;cursor:pointer;transition:background .3s}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.tg[aria-checked=true]{background:#d62839;border-color:#d62839}.tg[aria-checked=true]::after{transform:translateX(22px)}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bh) + env(safe-area-inset-top,0));width:100%;height:calc(100% - var(--bh) - env(safe-area-inset-top,0));border:0;background:#141d3d;opacity:1;transition:opacity .22s ease}
iframe.out{opacity:0}
@media(max-width:560px){html{--bh:84px}.bar{flex-wrap:wrap;align-content:center;gap:6px 10px;padding:0 10px}.bar nav{order:1;flex:1 0 100%;margin:0}.bar nav a:first-child{margin-left:auto}.bar nav a:last-child{margin-right:auto}.sw{order:2;margin:0 auto}}
</style></head><body>
<div class="bar"><nav><a href="../">Changelog</a><a href="../aggiornamenti.html">Aggiornamenti</a><a class="on" href="./">Anteprima 5.2</a><a href="../lab/">Laboratorio</a></nav><label class="sw"><span id="la">Lega</span><button class="tg" id="tg" role="switch" aria-checked="false" aria-label="Grafica Stadio"></button><span id="ln">Stadio</span></label></div>
<iframe id="f" title="Anteprima"></iframe>
<script>
var BASE=location.origin+location.pathname.replace(/ufficiale\/.*$/,'');var f=document.getElementById('f'),tg=document.getElementById('tg'),la=document.getElementById('la'),ln=document.getElementById('ln');
var HOME={a:'girrr/index.html',n:'nuovo/girrr/index.html'};
function fresco(u){var h='',i=u.indexOf('#');if(i>=0){h=u.slice(i);u=u.slice(0,i)}u=u.replace(/[?&]_t=\d+/,'');return u+(u.indexOf('?')<0?'?':'&')+'_t='+Date.now()+h}
function pulisci(u){return u.replace(/[?&]_t=\d+/,'')}
function modo(u){return (u.indexOf('/ufficiale/nuovo/')>=0||/\/anteprima\/(index\.html)?(\?[^#]*)?(#|$)/.test(u))?'n':'a'}
function conv(u,m){
  u=u.replace('/ufficiale/nuovo/girrr/','/ufficiale/girrr/').replace(/\/anteprima\/(index\.html)?(?=#|$)/,'/anteprima/attuale.html');
  return m==='n'?u.replace('/ufficiale/girrr/','/ufficiale/nuovo/girrr/').replace('/anteprima/attuale.html','/anteprima/'):u}
function mark(m){tg.setAttribute('aria-checked',m==='n');la.className=m==='a'?'on':'';ln.className=m==='n'?'on':''}
function cambia(m){var u='';try{u=f.contentWindow.location.href}catch(e){}
  var dest=(!u||u==='about:blank')?HOME[m]:conv(pulisci(u),m);mark(m);try{localStorage.setItem('orr_gv',m)}catch(e){}
  f.classList.add('out');setTimeout(function(){f.src=fresco(dest)},230)}
window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&(e.data.orrGrafica==='a'||e.data.orrGrafica==='n'))cambia(e.data.orrGrafica)});
tg.onclick=function(){cambia(tg.getAttribute('aria-checked')==='true'?'a':'n')};
function salva(){try{var u=f.contentWindow.location.href;if(u&&u.indexOf(BASE)===0)localStorage.setItem('orr_gu',pulisci(u))}catch(e){}}
f.addEventListener('load',function(){f.classList.remove('out');try{var m=modo(f.contentWindow.location.href);mark(m);localStorage.setItem('orr_gv',m)}catch(e){}salva()});setInterval(salva,800);
// la prima volta: grafica ufficiale (attuale); poi si ricorda l'ultima scelta
var s='a';try{var v=localStorage.getItem('orr_gv');if(v==='n'||v==='a')s=v}catch(e){}
var h=(location.hash||'').slice(1);if(h==='nuova')s='n';if(h==='attuale')s='a';
var gu='';try{gu=localStorage.getItem('orr_gu')||''}catch(e){}
if(h==='nuova'||h==='attuale')gu='';
f.src=fresco((gu&&gu.indexOf(BASE)===0)?conv(gu,s):HOME[s]);
mark(s);
</script></body></html>
