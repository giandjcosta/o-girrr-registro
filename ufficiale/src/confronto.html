<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>O Girrr · Anteprima 5.0</title>
<style>
html,body{margin:0;height:100%;background:#141d3d;font-family:Inter,system-ui,-apple-system,sans-serif}
.bar{position:fixed;top:0;left:0;right:0;height:46px;padding:0 10px;display:flex;align-items:center;gap:8px;background:#0f1630;border-bottom:1px solid rgba(255,255,255,.14);z-index:5;padding-top:env(safe-area-inset-top,0)}
.bar b{color:#ffd166;font-weight:900;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-right:auto}
.bar button{border:2px solid transparent;border-radius:99px;padding:7px 12px;font:800 13px Inter,system-ui,sans-serif;color:#fbf6ec;background:rgba(255,255,255,.1);cursor:pointer}
.bar button[aria-pressed=true]{background:#d62839}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top,0));width:100%;height:calc(100% - 46px - env(safe-area-inset-top,0));border:0;background:#141d3d}
</style></head><body>
<div class="bar"><b>Anteprima 5.0</b><button id="a" aria-pressed="false">Attuale</button><button id="n" aria-pressed="false">Nuova</button><button id="l" aria-pressed="false">Sfondo lega</button></div>
<iframe id="f" title="Anteprima"></iframe>
<script>
var f=document.getElementById('f'),B={a:document.getElementById('a'),n:document.getElementById('n'),l:document.getElementById('l')};
var HOME={a:'girrr/index.html',n:'nuovo/girrr/index.html',l:'lega/girrr/index.html'};
function modo(u){if(u.indexOf('/ufficiale/lega/')>=0||/\/anteprima\/lega\.html/.test(u))return 'l';if(u.indexOf('/ufficiale/nuovo/')>=0||/\/anteprima\/(index\.html)?(#|$)/.test(u))return 'n';return 'a'}
function conv(u,m){
  u=u.replace('/ufficiale/lega/girrr/','/ufficiale/girrr/').replace('/ufficiale/nuovo/girrr/','/ufficiale/girrr/').replace(/\/anteprima\/(lega\.html|index\.html)(?=#|$)/,'/anteprima/attuale.html').replace(/\/anteprima\/(?=#|$)/,'/anteprima/attuale.html');
  if(m==='n')return u.replace('/ufficiale/girrr/','/ufficiale/nuovo/girrr/').replace('/anteprima/attuale.html','/anteprima/');
  if(m==='l')return u.replace('/ufficiale/girrr/','/ufficiale/lega/girrr/').replace('/anteprima/attuale.html','/anteprima/lega.html');
  return u}
function mark(m){for(var k in B)B[k].setAttribute('aria-pressed',k===m)}
function vai(m){var u;try{u=f.contentWindow.location.href}catch(e){u=''}
  f.src=(!u||u==='about:blank')?HOME[m]:conv(u,m);mark(m);try{localStorage.setItem('gv',m)}catch(e){}}
for(var k in B)(function(k){B[k].onclick=function(){vai(k)}})(k);
function salva(){try{var u=f.contentWindow.location.href;if(u&&u!=='about:blank')localStorage.setItem('gu',u)}catch(e){}}
f.addEventListener('load',function(){try{var m=modo(f.contentWindow.location.href);mark(m);localStorage.setItem('gv',m)}catch(e){}salva()});setInterval(salva,800);
var s='a';try{s=localStorage.getItem('gv')||'a';if(s==='n'||s==='l'||s==='a'){}else s='a'}catch(e){}
var h=(location.hash||'').slice(1);if(h==='nuova')s='n';if(h==='attuale')s='a';if(h==='lega')s='l';
var gu='';try{gu=localStorage.getItem('gu')||''}catch(e){}
if(h==='nuova'||h==='attuale'||h==='lega')gu='';
if(gu&&gu.indexOf(location.origin+'/')===0){f.src=conv(gu,s)}else{f.src=HOME[s]}
mark(s);
</script></body></html>
