<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>O Girrr · Anteprima 5.0</title>
<style>
html,body{margin:0;height:100%;background:#141d3d;font-family:Inter,system-ui,-apple-system,sans-serif}
.bar{position:fixed;top:0;left:0;right:0;height:46px;padding:0 10px;display:flex;align-items:center;gap:8px;background:#0f1630;border-bottom:1px solid rgba(255,255,255,.14);z-index:5;padding-top:env(safe-area-inset-top,0)}
.bar b{color:#ffd166;font-weight:900;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-right:auto}
.bar button{border:2px solid transparent;border-radius:99px;padding:7px 14px;font:800 13px Inter,system-ui,sans-serif;color:#fbf6ec;background:rgba(255,255,255,.1);cursor:pointer}
.bar button[aria-pressed=true]{background:#d62839}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top,0));width:100%;height:calc(100% - 46px - env(safe-area-inset-top,0));border:0;background:#141d3d}
</style></head><body>
<div class="bar"><b>Anteprima 5.0</b><button id="a" aria-pressed="false">Grafica attuale</button><button id="n" aria-pressed="false">Grafica nuova</button></div>
<iframe id="f" title="Anteprima"></iframe>
<script>
var f=document.getElementById('f'),A=document.getElementById('a'),N=document.getElementById('n');
function nuova(u){return u.indexOf('/ufficiale/nuovo/')>=0||/\/anteprima\/(index\.html)?(#|$)/.test(u)}
function conv(u,n){
  if(n){return u.replace('/ufficiale/girrr/','/ufficiale/nuovo/girrr/').replace('/anteprima/attuale.html','/anteprima/')}
  return u.replace('/ufficiale/nuovo/girrr/','/ufficiale/girrr/').replace(/\/anteprima\/(index\.html)?(?=#|$)/,'/anteprima/attuale.html')}
function mark(n){A.setAttribute('aria-pressed',!n);N.setAttribute('aria-pressed',n)}
function vai(n){var u;try{u=f.contentWindow.location.href}catch(e){u=''}
  if(!u||u==='about:blank'){f.src=n?'nuovo/girrr/index.html':'girrr/index.html'}else{f.src=conv(u,n)}
  mark(n);try{localStorage.setItem('gv',n?'n':'a')}catch(e){}}
A.onclick=function(){vai(false)};N.onclick=function(){vai(true)};
f.addEventListener('load',function(){try{mark(nuova(f.contentWindow.location.href))}catch(e){}});
var s='a';try{s=localStorage.getItem('gv')||'a'}catch(e){}
var h=(location.hash||'').slice(1);if(h==='nuova')s='n';if(h==='attuale')s='a';
f.src=s==='n'?'nuovo/girrr/index.html':'girrr/index.html';mark(s==='n');
</script></body></html>
