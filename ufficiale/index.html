<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>O Girrr · Anteprima 5.3</title>
<style>
html{--bh:46px}html,body{margin:0;height:100%;background:#141d3d;font-family:Inter,system-ui,-apple-system,sans-serif}
.bar{position:fixed;top:0;left:0;right:0;height:var(--bh);padding:0 12px;display:flex;align-items:center;gap:10px;background:#0f1630;border-bottom:1px solid rgba(255,255,255,.14);z-index:5;padding-top:env(safe-area-inset-top,0)}
.bar a{color:#ffd166;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.bar nav{display:flex;gap:4px;margin-right:auto;min-width:0;overflow-x:auto;scrollbar-width:none}.bar nav::-webkit-scrollbar{display:none}.bar nav a{padding:6px 10px;border-radius:99px;font-size:11px;color:#fbf6ec;opacity:.7}.bar nav a.on{background:#d62839;opacity:1}.bar b{color:#fbf6ec;font-weight:900;font-size:13px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;align-items:center;gap:8px;color:#fbf6ec;font-weight:800;font-size:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sw span{opacity:.55;transition:opacity .25s}.sw span.on{opacity:1}
.tg{position:relative;width:52px;height:30px;border-radius:999px;background:#1d2a52;border:1px solid rgba(255,255,255,.28);padding:0;cursor:pointer;transition:background .3s}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.tg[aria-checked=true]{background:#d62839;border-color:#d62839}.tg[aria-checked=true]::after{transform:translateX(22px)}
iframe{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bh) + env(safe-area-inset-top,0));width:100%;height:calc(100% - var(--bh) - env(safe-area-inset-top,0));border:0;background:#141d3d;opacity:1;transition:opacity .22s ease}
iframe.out{opacity:0}
@media(max-width:560px){html{--bh:84px}.bar{flex-wrap:wrap;align-content:center;gap:6px 10px;padding:0 10px}.bar nav{order:1;flex:1 0 100%;margin:0}.bar nav a:first-child{margin-left:auto}.bar nav a:last-child{margin-right:auto}.sw{order:2;margin:0 auto}}
</style></head><body>
