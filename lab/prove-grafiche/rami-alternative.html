<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Rami · Tre disegni a confronto · O Girrr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* Prova di Claude (13 novembre 2026): tre modi di disegnare rami e sotto-rami per Ramificazioni. Dati veri da Git (rami-dati.json). */
:root{--bg:#0d1630;--card:#172654;--line:#2c3f73;--text:#f5f6fb;--muted:#b6c3e0;--oro:#ffd166;--rosso:#d62839}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at 70% -10%,#25407c 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
.w{max-width:1280px;margin:0 auto;padding:16px}
h1{font-family:Lobster,cursive;font-weight:400;font-size:clamp(30px,6vw,44px);margin:6px 0 4px}
.k{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.lead{color:var(--muted);max-width:760px;margin:0 0 14px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-weight:800;font-size:13px;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 13px;cursor:pointer;transition:background-color .25s,color .25s}
.seg button[aria-pressed=true]{background:var(--rosso);color:#fff}
.seg.oro button[aria-pressed=true]{background:var(--oro);color:#1a1405}
input[type=search]{font:inherit;font-size:14px;color:var(--text);background:#111c40;border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-width:0;flex:1 1 180px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.card{background:linear-gradient(160deg,var(--card),#111d42);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:hidden}
.card h2{margin:0 0 4px;font-size:19px}.card .sub{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.vista{transition:opacity .3s}.vista.esce{opacity:0}
/* Albero */
.albero ul{list-style:none;margin:0;padding-left:18px;border-left:2px solid rgba(255,255,255,.12)}
.albero>ul{padding-left:0;border:0}
.albero li{position:relative;margin:4px 0}
.albero ul ul>li::before{content:'';position:absolute;left:-18px;top:17px;width:14px;border-top:2px solid rgba(255,255,255,.12)}
.nodo{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05);border-left:4px solid var(--c);min-width:0}
.nodo b{font-size:13.5px;overflow-wrap:anywhere}.nodo small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.nodo .t{display:flex;flex-direction:column;min-width:0;flex:1}
.chip{flex:none;font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#164a35;color:#9ff0c6}
.chip.unito{background:rgba(255,255,255,.1);color:var(--muted)}.chip.main{background:var(--rosso);color:#fff}
.albero details>summary{list-style:none;cursor:pointer}.albero details>summary::-webkit-details-marker{display:none}
.albero summary .nodo::after{content:'▾';color:var(--muted);transition:transform .25s}.albero details:not([open])>summary .nodo::after{transform:rotate(-90deg)}
.unito-n{opacity:.62}
/* SVG */
.svgbox{width:100%;overflow:hidden}svg text{font-family:Inter,system-ui,sans-serif}
.nota{font-size:12.5px;color:var(--muted);margin:10px 0 0}
footer{color:var(--muted);font-size:12.5px;padding:18px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="w">
<div class="k">Registro · Prova di Claude</div><h1>Rami e sotto-rami</h1>
<p class="lead">Tre modi di disegnare gli stessi rami, con i dati veri di Git. Ogni ramo parte dal ramo da cui è nato davvero, non sempre da <code>main</code>: così si vedono anche le sotto-ramificazioni.</p>
<div class="barra">
 <div class="seg" id="vista" role="group" aria-label="Disegno"><button data-v="albero" aria-pressed="true">Albero</button><button data-v="metro" aria-pressed="false">Linea del tempo</button><button data-v="ventaglio" aria-pressed="false">Ventaglio</button></div>
 <div class="seg oro" id="repo" role="group" aria-label="Repository"><button data-r="0" aria-pressed="true">Sito</button><button data-r="1" aria-pressed="false">Registro</button></div>
 <div class="seg oro" id="stato" role="group" aria-label="Stato"><button data-s="attivi" aria-pressed="false">Attivi</button><button data-s="aperti" aria-pressed="true">Non uniti</button><button data-s="tutti" aria-pressed="false">Tutti</button></div>
 <input type="search" id="cerca" placeholder="Cerca un ramo, un assistente o una novità">
</div>
<div class="legenda" id="legenda"></div>
<div class="card vista" id="box"></div>
<footer id="piede"></footer>
</div>
<script>
(function(){
var COL={Claude:'#f0a35e',ChatGPT:'#3fd29b',Grok:'#a78bfa',Gianluca:'#ffd166',VSCode:'#5aa9ff',Altro:'#8fa0c4'};
function aut(b){var a=b.autore||'';for(var k in COL)if(a.toLowerCase().indexOf(k.toLowerCase())===0)return k;if(/^claude\//.test(b.nome))return 'Claude';if(/^chatgpt\//.test(b.nome))return 'ChatGPT';if(/^grok\//.test(b.nome))return 'Grok';return 'Altro'}
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function giorno(t){return new Date(t*1000).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}
var D=null,S={v:'albero',r:0,s:'aperti',q:''};
try{var x=JSON.parse(localStorage.getItem('og:rami-prova')||'{}');['v','r','s'].forEach(function(k){if(x[k]!=null)S[k]=x[k]})}catch(e){}
document.getElementById('legenda').innerHTML=Object.keys(COL).map(function(k){return '<span><i style="background:'+COL[k]+'"></i>'+k+'</span>'}).join('')+'<span><i style="background:transparent;border:2px solid #8fa0c4"></i>Già unito</span><span>Attivo: lavoro negli ultimi 7 giorni</span>';
function sel(){var R=D[S.r],q=S.q.toLowerCase(),by={},keep={};R.rami.forEach(function(b){by[b.nome]=b});
 R.rami.forEach(function(b){var radice=R.radici.indexOf(b.nome)>=0,ok=radice||((S.s==='tutti'||(S.s==='aperti'&&b.stato!=='unito')||(S.s==='attivi'&&b.stato==='attivo'))&&(!q||(b.nome+' '+b.titolo+' '+b.autore).toLowerCase().indexOf(q)>=0));
  if(ok){var n=b.nome;while(n&&!keep[n]){keep[n]=1;n=by[n].padre}}});   // tieni anche gli antenati, così l'albero non si spezza
 var figli={};R.rami.forEach(function(b){if(keep[b.nome]&&b.padre)(figli[b.padre]=figli[b.padre]||[]).push(b)});
 Object.keys(figli).forEach(function(k){figli[k].sort(function(a,b){return (a.dataNascita||0)-(b.dataNascita||0)})});
 return {R:R,by:by,keep:keep,figli:figli,n:Object.keys(keep).length}}
function nodo(b,R){var main=R.radici.indexOf(b.nome)>=0,c=COL[aut(b)];
 return '<div class="nodo'+(b.stato==='unito'?' unito-n':'')+'" style="--c:'+(main?'#d62839':c)+'"><span class="t"><b>'+E(b.nome)+'</b><small>'+E(b.titolo)+' · '+giorno(b.data)+'</small></span><span class="chip'+(main?' main':b.stato==='attivo'?'':' unito')+'">'+(main?(b.nome==='main'?'Principale':'Sito pubblicato'):b.stato==='unito'?'Unito':b.stato==='attivo'?'Attivo':'Fermo')+'</span></div>'}
function albero(X){function rec(b){var f=X.figli[b.nome]||[];if(!f.length)return '<li>'+nodo(b,X.R)+'</li>';
  return '<li><details open><summary>'+nodo(b,X.R)+'</summary><ul>'+f.map(rec).join('')+'</ul></details></li>'}
 return '<h2>Albero</h2><p class="sub">Come le cartelle: sotto ogni ramo i rami nati da lui. Tocca un ramo per chiudere o aprire i suoi sotto-rami.</p><div class="albero"><ul>'+X.R.radici.map(function(n){return rec(X.by[n])}).join('')+'</ul></div>'}
function ordine(X){var out=[];X.R.radici.forEach(function(n){(function rec(b,d){out.push({b:b,d:d});(X.figli[b.nome]||[]).forEach(function(f){rec(f,d+1)})})(X.by[n],0)});return out}
function metro(X){var L=ordine(X),W=Math.max(320,document.getElementById('box').clientWidth-32),lab=W<640?Math.round(W*.42):300,riga=W<640?30:26,H=L.length*riga+40,
  t0=Math.min.apply(null,L.slice(1).map(function(o){return o.b.dataNascita||o.b.data}).concat([L[0].b.data])),t1=Math.max.apply(null,L.map(function(o){return o.b.data})),
  xs=function(t){return lab+12+(W-lab-30)*((t-t0)/Math.max(1,t1-t0))},y={},s='';
 L.forEach(function(o,i){y[o.b.nome]=24+i*riga});
 // griglia dei giorni
 for(var d=new Date(t0*1000);d.getTime()/1000<=t1;d.setDate(d.getDate()+1)){var gx=xs(d.getTime()/1000);if(d.getDate()%2===0||W>900)s+='<line x1="'+gx+'" y1="10" x2="'+gx+'" y2="'+(H-8)+'" stroke="rgba(255,255,255,.06)"/>'+(d.getDate()%(W<640?4:2)===0?'<text x="'+gx+'" y="'+(H-0)+'" fill="#8fa0c4" font-size="10" text-anchor="middle">'+d.getDate()+'/'+(d.getMonth()+1)+'</text>':'')}
 L.forEach(function(o){var b=o.b,c=!o.d?'#d62839':COL[aut(b)],yy=y[b.nome],x0=o.d?xs(b.dataNascita||b.data):lab+12,x1=Math.max(x0+4,xs(b.data)),u=b.stato==='unito';
  if(o.d){var py=y[b.padre];s+='<path d="M'+x0+' '+py+' C'+(x0+14)+' '+py+' '+(x0)+' '+yy+' '+(x0+14)+' '+yy+'" fill="none" stroke="'+c+'" stroke-width="2" opacity="'+(u?.45:.9)+'"/>';x0+=14}
  s+='<line x1="'+x0+'" y1="'+yy+'" x2="'+Math.max(x0,x1)+'" y2="'+yy+'" stroke="'+c+'" stroke-width="'+(o.d?3:5)+'" stroke-linecap="round" opacity="'+(u?.45:1)+'"/>';
  s+='<circle cx="'+Math.max(x0,x1)+'" cy="'+yy+'" r="'+(o.d?4.5:6)+'" fill="'+(u?'#172654':c)+'" stroke="'+c+'" stroke-width="2"/>';
  var nome=b.nome.length>(W<640?22:40)?b.nome.slice(0,W<640?21:39)+'…':b.nome;
  s+='<text x="'+(6+Math.min(o.d,8)*(W<640?5:9))+'" y="'+(yy+4)+'" fill="'+(u?'#8fa0c4':'#f5f6fb')+'" font-size="'+(W<640?11:12.5)+'" font-weight="'+(o.d?600:900)+'"><title>'+E(b.nome+' · '+b.titolo)+'</title>'+E(nome)+'</text>'});
 return '<h2>Linea del tempo</h2><p class="sub">Ogni riga è un ramo, dal giorno in cui nasce al suo ultimo lavoro. La curva parte dal ramo da cui è nato, nel giorno in cui si è staccato.</p><div class="svgbox"><svg viewBox="0 0 '+W+' '+(H+6)+'" width="'+W+'" height="'+(H+6)+'" role="img" aria-label="Linea del tempo dei rami">'+s+'</svg></div><p class="nota">Il nome a sinistra è rientrato quanto più il ramo è lontano da main.</p>'}
function ventaglio(X){var L=ordine(X),W=Math.max(320,document.getElementById('box').clientWidth-32),maxd=Math.max.apply(null,L.map(function(o){return o.d})),
  passo=Math.min(150,(W-40)/(maxd+1.6)),riga=W<640?34:28,y={},foglie=0,s='';
 // disposizione ad albero: le foglie una sotto l'altra, i padri al centro dei figli
 function pos(b){var f=X.figli[b.nome]||[];if(!f.length){y[b.nome]=24+(foglie++)*riga;return y[b.nome]}var a=f.map(pos);y[b.nome]=(Math.min.apply(null,a)+Math.max.apply(null,a))/2;return y[b.nome]}
 X.R.radici.forEach(function(n,i){if(i)foglie++;pos(X.by[n])});
 var H=24+foglie*riga+(X.R.radici.length-1)*riga,dx=function(o){return 14+o.d*passo};
 L.forEach(function(o){if(!o.d)return;var b=o.b,p=X.by[b.padre],po=L.filter(function(z){return z.b===p})[0],c=COL[aut(b)],x0=dx(po),x1=dx(o);
  s+='<path d="M'+x0+' '+y[p.nome]+' C'+(x0+passo*.55)+' '+y[p.nome]+' '+(x1-passo*.55)+' '+y[b.nome]+' '+x1+' '+y[b.nome]+'" fill="none" stroke="'+c+'" stroke-width="2.5" opacity="'+(b.stato==='unito'?.4:.95)+'"/>'});
 L.forEach(function(o){var b=o.b,c=o.d?COL[aut(b)]:'#d62839',u=b.stato==='unito',x=dx(o),foglia=!(X.figli[b.nome]||[]).length;
  s+='<circle cx="'+x+'" cy="'+y[b.nome]+'" r="'+(o.d?5:8)+'" fill="'+(u?'#172654':c)+'" stroke="'+c+'" stroke-width="2"/>';
  var nome=foglia||!o.d?b.nome:b.nome.split('/').pop(),max=foglia?Math.floor((W-x-16)/6.6):o.d?14:20;nome=nome.length>max?nome.slice(0,Math.max(4,max-1))+'…':nome;
  s+='<text x="'+(x+(foglia?10:o.d?0:-8))+'" y="'+(y[b.nome]+(foglia?4:o.d?-10:-14))+'" text-anchor="'+(foglia||!o.d?'start':'middle')+'" fill="'+(u?'#8fa0c4':'#f5f6fb')+'" font-size="'+(W<640?11:12)+'" font-weight="'+(o.d?600:900)+'"><title>'+E(b.nome+' · '+b.titolo)+'</title>'+E(nome)+'</text>'});
 return '<h2>Ventaglio</h2><p class="sub">Da main a sinistra i rami si aprono verso destra: ogni passo in avanti è un livello di sotto-ramificazione.</p><div class="svgbox"><svg viewBox="0 0 '+W+' '+(H+10)+'" width="'+W+'" height="'+(H+10)+'" role="img" aria-label="Ventaglio dei rami">'+s+'</svg></div>'}
function disegna(){if(!D)return;var X=sel(),box=document.getElementById('box');
 box.classList.add('esce');setTimeout(function(){box.innerHTML=(S.v==='albero'?albero:S.v==='metro'?metro:ventaglio)(X);box.classList.remove('esce')},matchMedia('(prefers-reduced-motion: reduce)').matches?0:150);
 document.getElementById('piede').textContent=X.R.repo+' · '+(X.n-X.R.radici.length)+' rami mostrati su '+(X.R.rami.length-X.R.radici.length)+' · Dati di Git del '+new Date(D.generato*1000).toLocaleString('it-IT',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
 [['vista','v'],['repo','r'],['stato','s']].forEach(function(p){[].forEach.call(document.querySelectorAll('#'+p[0]+' button'),function(bt){bt.setAttribute('aria-pressed',String(bt.dataset[p[1]]==String(S[p[1]])))})});
 try{localStorage.setItem('og:rami-prova',JSON.stringify({v:S.v,r:S.r,s:S.s}))}catch(e){}}
[['vista','v'],['repo','r'],['stato','s']].forEach(function(p){document.getElementById(p[0]).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S[p[1]]=p[1]==='r'?+b.dataset.r:b.dataset[p[1]];disegna()})});
document.getElementById('cerca').addEventListener('input',function(e){S.q=e.target.value;disegna()});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(S.v!=='albero')disegna()},200)});
fetch('rami-dati.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){D=j.repository;D.generato=j.generato;disegna()}).catch(function(){document.getElementById('box').textContent='Dati non caricati.'});
})();
</script>
</body></html>
