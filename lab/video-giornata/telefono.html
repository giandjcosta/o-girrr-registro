<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video dal telefono · Prova</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Lobster&display=swap">
<style>
/* Strada C (Claude, 12 novembre 2026): il video lo crea il telefono. L'animazione è disegnata su un canvas con i dati veri
   (data.json) e registrata dal browser con MediaRecorder: MP4 su iPhone, WebM o MP4 su Android e PC. Nessun server, nessun costo.
   Con ?sq=Oranje%20VC il video è «la giornata di» quella squadra. */
*{box-sizing:border-box;margin:0}
body{background:#0d1430;color:#fbf6ec;font:700 15px Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
canvas{width:min(360px,90vw);aspect-ratio:9/16;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#1d2a52}
button{border:0;border-radius:999px;padding:13px 22px;background:#ffd166;color:#1d2a52;font:900 16px Inter,sans-serif;cursor:pointer}
button[disabled]{opacity:.6}
#stato{color:#cbd5e1;font-weight:600;text-align:center;max-width:360px}
a{color:#ffd166}
</style>
</head>
<body>
<canvas id="c" width="720" height="1280" aria-label="Anteprima del video"></canvas>
<button id="rec" type="button">Crea il video</button>
<div id="stato">Il telefono disegna e registra il video da solo, in circa 16 secondi.</div>
<script>
(function(){
 var SITO='/o-fant-a-girrr/',cv=document.getElementById('c'),g=cv.getContext('2d'),W=720,H=1280,DATI=null,DUR=16,q=new URLSearchParams(location.search);
 var NOMI={'The Blue brothers':'The Blues Brothers'};function nm(s){return NOMI[s]||s}
 var LOGO=new Image();LOGO.src=SITO+'assets/loghi/logo-lega-o-fant-a-girrr.png';
 function eo(t){t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3)}            /* uscita morbida */
 function mol(t){t=Math.max(0,Math.min(1,t));return 1-Math.exp(-6*t)*Math.cos(9*t)} /* molla con un piccolo rimbalzo */
 function txt(s,x,y,f,c,al,mw){g.font=f;g.fillStyle=c;g.textAlign=al||'left';if(mw)g.fillText(s,x,y,mw);else g.fillText(s,x,y)}   /* mw: larghezza massima, il testo si stringe */
 function sfondo(){var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2c3f7c');gr.addColorStop(.45,'#1d2a52');gr.addColorStop(1,'#141d3d');g.fillStyle=gr;g.fillRect(0,0,W,H);
  var r=g.createRadialGradient(620,-40,10,620,-40,620);r.addColorStop(0,'rgba(214,40,57,.35)');r.addColorStop(1,'rgba(214,40,57,0)');g.fillStyle=r;g.fillRect(0,0,W,H)}
 function banda(y,p){g.save();g.beginPath();g.rect(56,y,(W-112)*eo(p),14);g.clip();g.setTransform(1,0,-1,1,0,0);g.translate(y,0);
  g.fillStyle='#0f1736';g.fillRect(56,y,W-112,14);g.fillStyle='#d62839';g.fillRect(56,y,80,14);g.fillStyle='#ffd166';g.fillRect(136,y,14,14);g.restore()}
 function scena(t){var d=DATI;sfondo();g.globalAlpha=1;
  if(t<2.8){var k=mol(t/1.1);g.save();g.translate(W/2,520);g.scale(.4+.6*k,.4+.6*k);g.rotate((1-k)*-.2);if(LOGO.complete)g.drawImage(LOGO,-150,-173,300,346);g.restore();
   g.globalAlpha=eo((t-.35)/.6);txt(d.n+'ª giornata',W/2,800,'92px Lobster','#fbf6ec','center');g.globalAlpha=eo((t-.6)/.6);txt('CAMPIONATO · I RISULTATI',W/2,860,'900 24px Inter','#ffd166','center');g.globalAlpha=1}
  else if(t<9){var u=t-2.8;txt('CAMPIONATO · '+d.n+'ª GIORNATA',56,150,'900 24px Inter','#ffd166');txt('I risultati',56,230,'64px Lobster','#fbf6ec');banda(262,u/.9);
   d.m.forEach(function(m,i){var p=mol((u-.5-i*.45)/.7),y=330+i*150,x=56+(1-p)*160,r=m[4].split('-').map(Number);g.globalAlpha=Math.min(1,Math.max(0,(u-.5-i*.45)/.3));
    g.fillStyle='rgba(255,255,255,.09)';g.beginPath();g.roundRect(x,y,W-112,120,22);g.fill();g.fillStyle='#d62839';g.fillRect(x,y,10,120);
    txt(nm(m[0]),x+30,y+72,'800 26px Inter',r[0]>r[1]?'#ffd166':'#fbf6ec','left',(W-112)/2-115);txt(nm(m[3]),x+W-142,y+72,'800 26px Inter',r[1]>r[0]?'#ffd166':'#fbf6ec','right',(W-112)/2-115);
    g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.roundRect(x+(W-112)/2-75,y+28,150,64,16);g.fill();txt(r[0]+' - '+r[1],x+(W-112)/2,y+76,'900 46px Inter','#fbf6ec','center');g.globalAlpha=1})}
  else if(t<13.2){var v=t-9;txt('CAMPIONATO',56,150,'900 24px Inter','#ffd166');txt('La classifica dopo la '+d.n+'ª',56,230,'56px Lobster','#fbf6ec');banda(262,v/.9);
   [[d.c[1],2,320,.9,'#dfe6f3'],[d.c[0],1,420,.5,'#ffd166'],[d.c[2],3,250,1.2,'#e7a46a']].forEach(function(x,i){var p=mol((v-x[3])/1),h=x[2]*p,cx=110+i*250,y0=1120;
    g.fillStyle=x[4];g.beginPath();g.roundRect(cx-95,y0-h,190,h,[18,18,6,6]);g.fill();g.globalAlpha=Math.min(1,Math.max(0,(v-x[3])/.4));
    txt(String(x[1]),cx,y0-h+90,'84px Lobster','#1d2a52','center');txt(nm(x[0].n),cx,y0-x[2]-60,'800 26px Inter','#fbf6ec','center');txt(x[0].pt+' punti',cx,y0-x[2]-24,'700 24px Inter','#ffd166','center');g.globalAlpha=1})}
  else{var w=t-13.2,bm=d.big;txt('PROSSIMA GIORNATA · '+(d.n+1)+'ª',56,150,'900 24px Inter','#ffd166');txt('La partita da non perdere',56,230,'52px Lobster','#fbf6ec');
   var p=mol(w/.8);g.save();g.translate(W/2,520);g.scale(.8+.2*p,.8+.2*p);g.globalAlpha=Math.min(1,w/.4);var gr=g.createLinearGradient(-300,0,300,0);gr.addColorStop(0,'#d62839');gr.addColorStop(1,'#8e1a2a');g.fillStyle=gr;g.beginPath();g.roundRect(-304,-150,608,300,26);g.fill();
   txt(nm(bm[0]),0,-50,'900 44px Inter','#fbf6ec','center');txt('contro',0,20,'54px Lobster','#ffd166','center');txt(nm(bm[3]),0,90,'900 44px Inter','#fbf6ec','center');g.restore();g.globalAlpha=1;
   txt('Tutto su O Girrr',W/2,1160,'800 28px Inter','#fbf6ec','center')}}
 function anima(t0,fine){var t=(performance.now()-t0)/1000;scena(Math.min(t,DUR));if(t<DUR)requestAnimationFrame(function(){anima(t0,fine)});else if(fine)fine()}
 fetch(SITO+'data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(D){var L=D.cal.lega,gi=L.filter(function(x){return x.m.every(function(m){return m[4]&&m[4]!=='-'})}),n=+q.get('n')||gi[gi.length-1].n,g0=L.filter(function(x){return x.n===n})[0],dopo=L.filter(function(x){return x.n===n+1})[0];
  var T={};gi.filter(function(x){return x.n<=n}).forEach(function(x){x.m.forEach(function(m){var r=m[4].split('-').map(Number);[[m[0],r[0],r[1],m[1]],[m[3],r[1],r[0],m[2]]].forEach(function(s){var t=T[s[0]]=T[s[0]]||{n:s[0],pt:0,fp:0};t.fp+=s[3];t.pt+=s[1]>s[2]?3:s[1]===s[2]?1:0})})});
  var C=Object.keys(T).map(function(k){return T[k]}).sort(function(a,b){return b.pt-a.pt||b.fp-a.fp});   /* come la Curva: a pari punti conta il totale della stagione */
  DATI={n:n,m:g0.m,c:C,big:dopo?(dopo.m.filter(function(m){return m[0]===C[0].n||m[3]===C[0].n})[0]||dopo.m[0]):g0.m[0]};
  return Promise.all([document.fonts.load('64px Lobster'),document.fonts.load('900 24px Inter')]).catch(function(){})}).then(function(){anima(performance.now());window.__pronto=true})
 .catch(function(){document.getElementById('stato').textContent='Non riesco a leggere i dati della giornata.'});
 document.getElementById('rec').onclick=function(){if(!DATI)return;var b=this,st=document.getElementById('stato');
  if(!window.MediaRecorder||!cv.captureStream){st.textContent='Questo browser non sa registrare video.';return}
  var tipi=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'],tipo=tipi.filter(function(x){return MediaRecorder.isTypeSupported(x)})[0]||'';
  var rec=new MediaRecorder(cv.captureStream(30),tipo?{mimeType:tipo,videoBitsPerSecond:6e6}:{}),pezzi=[];
  rec.ondataavailable=function(e){if(e.data&&e.data.size)pezzi.push(e.data)};
  rec.onstop=function(){var bl=new Blob(pezzi,{type:rec.mimeType||'video/webm'}),est=/mp4/.test(bl.type)?'mp4':'webm',f=new File([bl],'giornata-'+DATI.n+'.'+est,{type:bl.type});window.__video=bl;b.disabled=false;
   if(navigator.canShare&&navigator.canShare({files:[f]})){st.textContent='Fatto: scegli dove mandarlo.';navigator.share({files:[f]}).catch(function(){})}
   else{var u=URL.createObjectURL(bl);st.innerHTML='Fatto ('+est.toUpperCase()+', '+Math.round(bl.size/1024)+' KB): <a href="'+u+'" download="'+f.name+'">scarica il video</a>.'}};
  b.disabled=true;st.textContent='Registro… (16 secondi)';rec.start(500);anima(performance.now(),function(){setTimeout(function(){rec.stop()},200)})};
})();
</script>
</body>
</html>
