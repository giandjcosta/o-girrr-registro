<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video della giornata · Prova</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Lobster&display=swap">
<style>
/* Video della giornata (Claude, 12 novembre 2026). Prova del Lab: un video verticale di 16 secondi (storie di Instagram,
   stato di WhatsApp) fatto dai dati veri del sito (data.json), senza servizi a pagamento. Livello sportivo:
   risultati, gol, punti in classifica; niente fantapunti. ?n=7 sceglie la giornata (di partenza l'ultima giocata). */
:root{--blu:#1d2a52;--blu2:#2c3f7c;--oro:#ffd166;--rosso:#d62839;--chiaro:#fbf6ec;--az:#3d93d6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0d1430;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;color:var(--chiaro)}
#palco{width:720px;height:1280px;position:relative;overflow:hidden;flex:none;transform-origin:center;
  background:radial-gradient(700px 500px at 85% -5%,rgba(214,40,57,.35),transparent 60%),radial-gradient(800px 600px at -10% 30%,rgba(61,147,214,.3),transparent 60%),linear-gradient(180deg,var(--blu2),var(--blu) 45%,#141d3d)}
.scena{position:absolute;inset:0;padding:90px 56px;display:flex;flex-direction:column;opacity:0;animation:scena var(--dur) linear var(--da) both}
@keyframes scena{0%{opacity:0}4%{opacity:1}96%{opacity:1}100%{opacity:0}}
.ultima{animation-name:scena-fine}
@keyframes scena-fine{0%{opacity:0}6%{opacity:1}100%{opacity:1}}
.banda{height:14px;border-radius:3px;transform:skewX(-45deg);background:linear-gradient(90deg,var(--rosso) 0 12%,var(--oro) 12% calc(12% + 14px),#0f1736 calc(12% + 14px) 100%);margin:26px 0 34px;animation:allarga .9s cubic-bezier(.2,.9,.25,1) var(--da) both}
@keyframes allarga{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.su{animation:su .8s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--da) + var(--d,0s))}
@keyframes su{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
.lato{animation:lato .7s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:calc(var(--da) + var(--d,0s))}
@keyframes lato{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
.kick{font-weight:900;letter-spacing:.32em;font-size:24px;color:var(--oro)}
h1,h2,.lob{font-family:Lobster,'Brush Script MT',cursive;font-weight:400}
h1{font-size:92px;line-height:1.05}
h2{font-size:64px;line-height:1.1}
/* 1. Apertura */
.apri{align-items:center;justify-content:center;text-align:center}
.apri img.logo{width:300px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45));animation:logo 1.1s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:var(--da)}
@keyframes logo{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
.apri h1{margin-top:40px}
.apri .tv{width:330px;margin-top:46px;border-radius:6px}
/* 2. Risultati */
.ris{display:flex;flex-direction:column;gap:22px}
.par{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:24px 26px;border-radius:22px;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
.par::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--rosso)}
.par b{font-size:28px;font-weight:800;line-height:1.15}
.par b:last-child{text-align:right}
.par b.vince{color:var(--oro)}
.gol{font-size:54px;font-weight:900;letter-spacing:.04em;color:var(--chiaro);background:rgba(0,0,0,.28);border-radius:16px;padding:6px 18px;min-width:150px;text-align:center}
/* 3. Classifica */
.podio{display:flex;align-items:flex-end;justify-content:center;gap:22px;flex:1;padding-bottom:40px}
.gr{width:190px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gr .nome{font-size:28px;font-weight:800;line-height:1.15;min-height:70px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:14px}
.gr .pt{font-size:26px;font-weight:700;color:var(--oro);margin-bottom:12px}
.col{width:100%;border-radius:18px 18px 6px 6px;display:flex;align-items:flex-start;justify-content:center;padding-top:20px;font-family:Lobster,cursive;font-size:88px;
  transform-origin:bottom;animation:cresce 1s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:calc(var(--da) + var(--d,0s))}
@keyframes cresce{from{transform:scaleY(0)}to{transform:none}}
.p1 .col{height:420px;background:linear-gradient(180deg,#ffd166,#c99a2e);color:var(--blu)}
.p2 .col{height:320px;background:linear-gradient(180deg,#dfe6f3,#8e9bb5);color:var(--blu)}
.p3 .col{height:250px;background:linear-gradient(180deg,#e7a46a,#a2643a);color:var(--blu)}
.resto{font-size:24px;color:rgba(251,246,236,.85);text-align:center;line-height:1.5}
/* 4. Prossima giornata */
.big{margin-top:60px;padding:40px 30px;border-radius:26px;text-align:center;background:linear-gradient(120deg,var(--rosso),#8e1a2a 60%,#141d3d 130%);box-shadow:0 30px 60px rgba(0,0,0,.4)}
.big .vs{font-size:46px;font-weight:900;line-height:1.2}
.big .vs i{display:block;font-style:normal;font-family:Lobster,cursive;font-weight:400;color:var(--oro);font-size:56px;margin:8px 0}
.altre{margin-top:34px;display:flex;flex-direction:column;gap:12px;font-size:25px;font-weight:700;text-align:center;color:rgba(251,246,236,.9)}
.firma{margin-top:auto;text-align:center;font-weight:800;font-size:26px;letter-spacing:.06em}
.firma img{width:280px;display:block;margin:0 auto 16px;border-radius:6px}
#riparti{position:fixed;right:14px;bottom:14px;font:800 15px Inter,sans-serif;background:var(--oro);color:var(--blu);border:0;border-radius:999px;padding:12px 18px;cursor:pointer}
body.rec #riparti{display:none}
#msg{position:fixed;inset:auto 0 50% 0;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}.scena{opacity:1;position:relative;inset:auto}}
</style>
</head>
<body>
<div id="palco"></div>
<button id="riparti" type="button">Riparti</button>
<div id="msg">Carico la giornata…</div>
<script>
(function(){
  var SITO='/o-fant-a-girrr/';
  var NOMI={'The Blue brothers':'The Blues Brothers'};          /* nome mostrato, come nomi.js del sito */
  function nm(s){return NOMI[s]||s}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var q=new URLSearchParams(location.search);if(q.has('rec'))document.body.classList.add('rec');
  function adatta(){var p=document.getElementById('palco'),k=Math.min(innerWidth/720,innerHeight/1280);p.style.transform='scale('+k+')'}
  addEventListener('resize',adatta);adatta();
  var caratteri=Promise.race([Promise.all([document.fonts.load('64px Lobster'),document.fonts.load('800 28px Inter')]),new Promise(function(r){setTimeout(r,2500)})]);   /* il video parte con i caratteri giusti */
  Promise.all([fetch(SITO+'data.json',{cache:'no-store'}).then(function(r){return r.json()}),caratteri]).then(function(x){var d=x[0];
    var G=d.cal.lega,giocate=G.filter(function(g){return g.m.every(function(m){return m[4]&&m[4]!=='-'})});
    var n=+q.get('n')||giocate[giocate.length-1].n,g=G.filter(function(x){return x.n===n})[0],dopo=G.filter(function(x){return x.n===n+1})[0];
    /* classifica dopo la giornata: 3 punti la vittoria, 1 il pareggio; nel video solo le prime tre (controllate con il Tabellone) */
    var T={};giocate.filter(function(x){return x.n<=n}).forEach(function(x){x.m.forEach(function(m){var r=m[4].split('-').map(Number);
      [[m[0],r[0],r[1]],[m[3],r[1],r[0]]].forEach(function(s){var t=T[s[0]]=T[s[0]]||{n:s[0],pt:0,gf:0,gs:0};t.gf+=s[1];t.gs+=s[2];t.pt+=s[1]>s[2]?3:s[1]===s[2]?1:0})})});
    var C=Object.keys(T).map(function(k){return T[k]}).sort(function(a,b){return b.pt-a.pt||(b.gf-b.gs)-(a.gf-a.gs)||b.gf-a.gf});
    var h='';
    /* 1. Apertura (0–2,6 s) */
    h+='<section class="scena apri" style="--da:0s;--dur:2.8s"><img class="logo" src="'+SITO+'assets/loghi/logo-lega-o-fant-a-girrr.png" alt=""><h1 class="su" style="--d:.35s">'+n+'ª giornata</h1><div class="kick su" style="--d:.6s">CAMPIONATO · I RISULTATI</div></section>';
    /* 2. Risultati (2,6–8,8 s) */
    h+='<section class="scena" style="--da:2.6s;--dur:6.4s"><div class="kick su">CAMPIONATO · '+n+'ª GIORNATA</div><h2 class="su" style="--d:.15s">I risultati</h2><div class="banda" style="--da:2.8s"></div><div class="ris">'+
      g.m.map(function(m,i){var r=m[4].split('-').map(Number);return '<div class="par lato" style="--d:'+(.5+i*.45)+'s"><b class="'+(r[0]>r[1]?'vince':'')+'">'+esc(nm(m[0]))+'</b><span class="gol">'+r[0]+' - '+r[1]+'</span><b class="'+(r[1]>r[0]?'vince':'')+'">'+esc(nm(m[3]))+'</b></div>'}).join('')+'</div></section>';
    /* 3. Classifica (8,8–13,2 s) */
    var p=C.slice(0,3);
    h+='<section class="scena" style="--da:8.8s;--dur:4.6s"><div class="kick su">CAMPIONATO</div><h2 class="su" style="--d:.15s">La classifica dopo la '+n+'ª</h2><div class="banda" style="--da:9s"></div><div class="podio">'+
      [[p[1],2,'.9s'],[p[0],1,'.5s'],[p[2],3,'1.2s']].map(function(x){return '<div class="gr p'+x[1]+'"><div class="nome su" style="--d:'+x[2]+'">'+esc(nm(x[0].n))+'</div><div class="pt su" style="--d:'+x[2]+'">'+x[0].pt+' punti</div><div class="col" style="--d:'+x[2]+'">'+x[1]+'</div></div>'}).join('')+
      '</div></section>';   /* solo il podio: dal 4° posto in giù gli spareggi a pari punti della lega non sono quelli del calcolo qui */
    /* 4. Prossima giornata (13,2–16 s) */
    if(dopo){var bm=dopo.m.filter(function(m){return [m[0],m[3]].indexOf(C[0].n)>=0})[0]||dopo.m[0];
      h+='<section class="scena ultima" style="--da:13.2s;--dur:3s"><div class="kick su">PROSSIMA GIORNATA · '+dopo.n+'ª</div><h2 class="su" style="--d:.15s">La partita da non perdere</h2><div class="big su" style="--d:.4s"><div class="vs">'+esc(nm(bm[0]))+'<i>contro</i>'+esc(nm(bm[3]))+'</div></div><div class="altre">'+
        dopo.m.filter(function(m){return m!==bm}).map(function(m,i){return '<span class="lato" style="--d:'+(.8+i*.18)+'s">'+esc(nm(m[0]))+' - '+esc(nm(m[3]))+'</span>'}).join('')+
        '</div><div class="firma su" style="--d:1.6s"><img src="'+SITO+'assets/loghi/logo-tv-girrr-sport-live.png" alt="">Tutto su O Girrr</div></section>'}
    document.getElementById('palco').innerHTML=h;document.getElementById('msg').remove();
    document.getElementById('riparti').onclick=function(){var p2=document.getElementById('palco'),x=p2.innerHTML;p2.innerHTML='';void p2.offsetWidth;p2.innerHTML=x};
    window.__videoPronto=true;
  }).catch(function(e){document.getElementById('msg').textContent='Non riesco a leggere i dati della giornata.'});
})();
</script>
</body>
</html>
