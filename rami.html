<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Rami e sotto-rami · O Girrr</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* Claude (13-14 novembre 2026): tre disegni interattivi di rami e sotto-rami, in cima a Ramificazioni (Gianluca: «tutti e 3»).
   Tocca un pallino: la vista si avvicina a quel ramo e si apre la scheda con i dettagli e i commit veri su GitHub.
   Dati da Git: rami-dati.json, scritto da rami_genera.py. Il workflow ramificazioni.yml lo rifà ogni 15 minuti sul ramo tecnico
   chatgpt/dati-ramificazioni; la pagina lo rilegge ogni minuto (la copia qui accanto serve se la rete non risponde).
   Con ?dentro la pagina sta dentro ramificazioni.html: senza titolo, e comunica la sua altezza alla pagina che la contiene. */
html.dentro .capo{display:none}html.dentro body{background:transparent}html.dentro .w{padding-top:0}
:root{--bg:#0d1630;--card:#172654;--line:#2c3f73;--text:#f5f6fb;--muted:#b6c3e0;--oro:#ffd166;--rosso:#d62839}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at 70% -10%,#25407c 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
a{color:var(--oro)}
.w{max-width:1380px;margin:0 auto;padding:16px}
h1{font-family:Lobster,cursive;font-weight:400;font-size:clamp(30px,6vw,44px);margin:6px 0 4px}
.k{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.lead{color:var(--muted);max-width:780px;margin:0 0 14px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.seg{display:inline-flex;flex-wrap:wrap;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-weight:800;font-size:13px;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 13px;cursor:pointer;transition:background-color .25s,color .25s}
.seg button[aria-pressed=true]{background:var(--rosso);color:#fff}.seg.oro button[aria-pressed=true]{background:var(--oro);color:#1a1405}
input[type=search]{font:inherit;font-size:14px;color:var(--text);background:#111c40;border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-width:0;flex:1 1 180px}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lay{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media(min-width:960px){.lay.aperto{grid-template-columns:minmax(0,1fr) 380px}}
.card{background:linear-gradient(160deg,var(--card),#111d42);border:1px solid var(--line);border-radius:18px;padding:16px;overflow:hidden;min-width:0}
.card h2{margin:0 0 4px;font-size:19px}.card .sub{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.vista{transition:opacity .25s}.vista.esce{opacity:0}
.comandi{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.comandi button{font:inherit;font-weight:800;font-size:13px;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.comandi button:hover{background:rgba(255,255,255,.14)}
/* tela delle viste a disegno: si trascina, si ingrandisce con la rotella o con due dita */
.tela{position:relative;width:100%;height:min(72vh,760px);border-radius:12px;background:rgba(5,10,30,.35);border:1px solid rgba(255,255,255,.06);touch-action:none;cursor:grab;overflow:hidden}
.tela:active{cursor:grabbing}.tela svg{display:block;width:100%;height:100%}
.tela .aiuto{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--muted);pointer-events:none;background:rgba(13,22,48,.7);padding:3px 8px;border-radius:999px}
svg text{font-family:Inter,system-ui,sans-serif;pointer-events:none}.tela svg path,.tela svg line{pointer-events:none}
.nodo-s{cursor:pointer}.nodo-s:focus{outline:none}.nodo-s:focus-visible circle.p{stroke:#fff;stroke-width:3}
.nodo-s circle.alone{opacity:0;transition:opacity .25s}.nodo-s:hover circle.alone,.nodo-s.sel circle.alone{opacity:.35}
.spento{opacity:.18;transition:opacity .3s}.acceso{opacity:1;transition:opacity .3s}
/* Albero */
.briciole{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 10px;font-size:13px}
.briciole button{font:inherit;font-weight:800;color:var(--oro);background:none;border:0;padding:2px 4px;cursor:pointer;border-radius:6px}
.briciole span{color:var(--muted)}
.albero ul{list-style:none;margin:0;padding-left:20px;border-left:2px solid rgba(255,255,255,.12)}
.albero>ul{padding-left:0;border:0}
.albero li{position:relative;margin:5px 0}
.albero ul ul>li::before{content:'';position:absolute;left:-20px;top:20px;width:16px;border-top:2px solid rgba(255,255,255,.12)}
.riga{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:12px;background:rgba(255,255,255,.05);border-left:4px solid var(--c);min-width:0;transition:background-color .25s,transform .3s}
.riga.sel{background:rgba(255,209,102,.12);box-shadow:0 0 0 1px rgba(255,209,102,.45)}
.pallino{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:var(--c);cursor:pointer;display:grid;place-items:center;color:#0d1630;font-weight:900;font-size:13px;transition:transform .2s}
.pallino.vuoto{background:transparent;color:var(--c)}.pallino:hover{transform:scale(1.12)}.pallino:focus-visible{outline:3px solid #fff;outline-offset:2px}
.riga .t{display:flex;flex-direction:column;min-width:0;flex:1;cursor:pointer}
.riga b{font-size:13.5px;overflow-wrap:anywhere}.riga small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.chip{flex:none;font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#164a35;color:#9ff0c6}
.chip.unito,.chip.fermo{background:rgba(255,255,255,.1);color:var(--muted)}.chip.main{background:var(--rosso);color:#fff}
.freccia{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.07);color:var(--muted);cursor:pointer;font-size:14px;transition:transform .25s}
.chiuso>.riga .freccia{transform:rotate(-90deg)}.chiuso>ul{display:none}
.zoom-in{animation:zoomin .45s cubic-bezier(.2,.8,.2,1)}@keyframes zoomin{from{transform:scale(.92);opacity:.2}to{transform:none;opacity:1}}
/* Scheda dei dettagli: di lato sul PC, dal basso sul telefono */
.dettagli{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.dettagli[hidden]{display:none}
@media(max-width:959px){.dettagli{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:78vh;border-radius:20px 20px 0 0;z-index:20;box-shadow:0 -16px 40px rgba(0,0,0,.5);animation:su .35s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dettagli .testa{display:flex;gap:10px;align-items:flex-start}.dettagli .testa i{flex:none;width:16px;height:16px;border-radius:50%;margin-top:5px}
.dettagli h3{margin:0;font-size:17px;overflow-wrap:anywhere}.dettagli .chiudi{margin-left:auto;flex:none;font:inherit;font-weight:900;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:var(--text);width:34px;height:34px;cursor:pointer}
.dettagli dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0;font-size:13.5px}.dettagli dt{color:var(--muted)}.dettagli dd{margin:0;overflow-wrap:anywhere}
.dettagli dd button,.dettagli .figli button{font:inherit;color:var(--oro);background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:700;overflow-wrap:anywhere}
.figli{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.figli button{background:rgba(255,255,255,.07);border-radius:999px;padding:4px 10px;font-size:12.5px}
.link{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.link a{font-weight:800;font-size:13px;text-decoration:none;padding:8px 12px;border-radius:999px;background:var(--oro);color:#1a1405}.link a.se{background:rgba(255,255,255,.1);color:var(--text)}
.commit{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.commit li{position:relative;padding:4px 0 10px 14px}.commit li::before{content:'';position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.commit .q{font-size:11.5px;color:var(--muted)}.commit a{display:block;font-size:13px;color:var(--text);text-decoration:none;overflow-wrap:anywhere}.commit a:hover{text-decoration:underline}
.commit code{font-size:11px;color:var(--oro)}
footer{color:var(--muted);font-size:12.5px;padding:18px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><script>if(/[?&]dentro\b/.test(location.search))document.documentElement.classList.add('dentro')</script><div class="w">
<div class="capo"><div class="k">Registro · Ramificazioni</div><h1>Rami e sotto-rami</h1></div>
<p class="lead">Tre modi di disegnare gli stessi rami, con i dati veri di Git. Ogni ramo parte dal ramo da cui è nato davvero. <b>Tocca un pallino</b>: la vista si avvicina a quel ramo e si aprono i dettagli, con i commit e i link a GitHub.</p>
<div class="barra">
 <div class="seg" id="vista" role="group" aria-label="Disegno"><button data-v="albero">Albero</button><button data-v="metro">Linea del tempo</button><button data-v="ventaglio">Ventaglio</button></div>
 <div class="seg oro" id="repo" role="group" aria-label="Repository"><button data-r="0">Sito</button><button data-r="1">Registro</button><button data-r="2">Entrambi</button></div>
 <div class="seg oro" id="stato" role="group" aria-label="Stato"><button data-s="attivi">Attivi</button><button data-s="aperti">Non uniti</button><button data-s="tutti">Tutti</button></div>
 <input type="search" id="cerca" placeholder="Cerca un ramo, un assistente o una novità" aria-label="Cerca">
</div>
<div class="legenda" id="legenda"></div>
<div class="lay" id="lay"><div class="card vista" id="box"></div><aside class="card dettagli" id="det" hidden aria-live="polite"></aside></div>
<footer id="piede"></footer>
</div>
<script>
(function(){
'use strict';
var GH={'o-fant-a-girrr':'https://github.com/giandjcosta/o-fant-a-girrr','o-girrr-registro':'https://github.com/giandjcosta/o-girrr-registro'};
var COL={Claude:'#f0a35e',ChatGPT:'#3fd29b',Grok:'#a78bfa',Gianluca:'#ffd166',VSCode:'#5aa9ff',Altro:'#8fa0c4'};
var FERMO=matchMedia('(prefers-reduced-motion: reduce)').matches;
function aut(x){var a=(typeof x==='string'?x:x.autore)||'';for(var k in COL)if(a.toLowerCase().indexOf(k.toLowerCase())===0)return k;
 if(typeof x!=='string'){if(/^claude\//.test(x.nome))return 'Claude';if(/^chatgpt\//.test(x.nome))return 'ChatGPT';if(/^grok\//.test(x.nome))return 'Grok';if(/^vscode\//.test(x.nome))return 'VSCode'}return 'Altro'}
function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function giorno(t,ora){return t?new Date(t*1000).toLocaleString('it-IT',ora?{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'short',year:'numeric'}):'Dato non conservato'}
function ramoUrl(R,n,b){return GH[(b&&b.repoVero)||R.repo]+'/tree/'+((b&&b.vero)||n).split('/').map(encodeURIComponent).join('/')}
var D=null,X=null,S={v:'albero',r:0,s:'aperti',q:'',sel:null,fuoco:null};
try{var x=JSON.parse(localStorage.getItem('og:rami-prova')||'{}');['v','r','s'].forEach(function(k){if(x[k]!=null)S[k]=x[k]})}catch(e){}
var h=/ramo=([^&]+)/.exec(location.hash);if(h)S.sel=decodeURIComponent(h[1]);var hr=/repo=(\d)/.exec(location.hash);if(hr)S.r=+hr[1];
document.getElementById('legenda').innerHTML=Object.keys(COL).map(function(k){return '<span><i style="background:'+COL[k]+'"></i>'+k+'</span>'}).join('')+'<span><i style="background:transparent;border:2px solid #8fa0c4"></i>Unito o fermo</span><span>Attivo: lavoro negli ultimi 7 giorni</span>';

/* ---------- dati della vista: rami da mostrare, figli, ordine ---------- */
/* Entrambi (Gianluca, 14 novembre 2026): sito e registro insieme; ogni ramo ha davanti «Sito ›» o «Registro ›» */
var UNITI=null;function unisci(){if(UNITI&&UNITI.d===D)return UNITI.R;var P={'o-fant-a-girrr':'Sito','o-girrr-registro':'Registro'},rami=[],radici=[];
 D.forEach(function(Q){var pre=P[Q.repo]+' › ';Q.rami.forEach(function(b){var c={};for(var k in b)c[k]=b[k];c.vero=b.nome;c.repoVero=Q.repo;c.padreVero=b.padre;c.nome=pre+b.nome;c.padre=b.padre?pre+b.padre:null;rami.push(c)});
  Q.radici.forEach(function(n){radici.push(pre+n)})});
 rami.sort(function(a,b){return a.data-b.data});UNITI={d:D,R:{repo:'sito e registro',tronco:radici[0],radici:radici,rami:rami}};return UNITI.R}
function prepara(){var R=S.r===2?unisci():D[S.r],q=S.q.toLowerCase(),by={},keep={};R.rami.forEach(function(b){by[b.nome]=b});
 R.rami.forEach(function(b){var rad=R.radici.indexOf(b.nome)>=0,ok=rad||b.nome===S.sel||((S.s==='tutti'||(S.s==='aperti'&&b.stato!=='unito')||(S.s==='attivi'&&b.stato==='attivo'))&&(!q||(b.nome+' '+b.titolo+' '+b.autore).toLowerCase().indexOf(q)>=0));
  if(ok){var n=b.nome;while(n&&by[n]&&!keep[n]){keep[n]=1;n=by[n].padre}}});
 var figli={},tutti={};R.rami.forEach(function(b){if(b.padre)(tutti[b.padre]=tutti[b.padre]||[]).push(b);if(keep[b.nome]&&b.padre)(figli[b.padre]=figli[b.padre]||[]).push(b)});
 [figli,tutti].forEach(function(F){Object.keys(F).forEach(function(k){F[k].sort(function(a,b){return (a.dataNascita||0)-(b.dataNascita||0)})})});
 var ordine=[];R.radici.forEach(function(n){(function rec(b,d){ordine.push({b:b,d:d});(figli[b.nome]||[]).forEach(function(f){rec(f,d+1)})})(by[n],0)});
 return {R:R,by:by,keep:keep,figli:figli,tutti:tutti,ordine:ordine,n:Object.keys(keep).length}}
function colore(b){return X.R.radici.indexOf(b.nome)>=0?'#d62839':COL[aut(b)]}
function antenati(n){var a={};while(n&&X.by[n]){a[n]=1;n=X.by[n].padre}return a}

/* ---------- scheda dei dettagli ---------- */
function dettagli(){var det=document.getElementById('det'),lay=document.getElementById('lay'),b=S.sel&&X.by[S.sel];
 if(!b){det.hidden=true;lay.classList.remove('aperto');return}
 var R=X.R,c=colore(b),rad=R.radici.indexOf(b.nome)>=0,f=X.tutti[b.nome]||[],stato=rad?(b.nome==='main'?'Principale':'Sito pubblicato'):b.stato==='unito'?'Unito':b.stato==='attivo'?'Attivo':'Fermo';
 det.innerHTML='<div class="testa"><i style="background:'+c+'"></i><div><div class="k" style="color:var(--muted)">'+E(aut(b))+' · '+stato+'</div><h3>'+E(b.nome)+'</h3></div><button class="chiudi" type="button" aria-label="Chiudi i dettagli" data-chiudi>×</button></div>'+
  '<p style="margin:8px 0 0;color:var(--muted);font-size:13.5px">'+E(b.titolo)+'</p>'+
  '<dl>'+(b.padre?'<dt>Nato da</dt><dd><button type="button" data-vai="'+E(b.padre)+'">'+E(b.padre)+'</button></dd><dt>Nato il</dt><dd>'+giorno(b.dataNascita)+'</dd>':'')+
  '<dt>Ultimo lavoro</dt><dd>'+giorno(b.data,1)+'</dd><dt>'+(rad?'Commit':'Commit propri')+'</dt><dd>'+(b.totale||0)+(b.padre?' rispetto a '+E(b.padre):'')+'</dd>'+
  '<dt>Sotto-rami</dt><dd>'+(f.length||'Nessuno')+'</dd></dl>'+
  (f.length?'<div class="figli">'+f.map(function(x){return '<button type="button" data-vai="'+E(x.nome)+'" style="border-left:3px solid '+colore(x)+'">'+E(x.nome)+'</button>'}).join('')+'</div>':'')+
  '<div class="link"><a href="'+ramoUrl(R,b.nome,b)+'" target="_blank" rel="noopener">Apri il ramo su GitHub ↗</a>'+(b.padre?'<a class="se" href="'+GH[b.repoVero||R.repo]+'/compare/'+encodeURIComponent(b.padreVero||b.padre)+'...'+encodeURIComponent(b.vero||b.nome)+'" target="_blank" rel="noopener">Confronta con '+E(b.padre)+' ↗</a>':'')+'</div>'+
  '<div class="k" style="margin:0 0 8px">Ultimi commit</div>'+(b.commit&&b.commit.length?'<ol class="commit">'+b.commit.map(function(k){return '<li style="--c:'+COL[aut(k[2])]+'"><div class="q">'+giorno(k[1],1)+' · '+E(k[2])+' · <code>'+k[0].slice(0,7)+'</code></div><a href="'+GH[b.repoVero||R.repo]+'/commit/'+k[0]+'" target="_blank" rel="noopener">'+E(k[3])+' ↗</a></li>'}).join('')+'</ol>'+((b.totale||0)>b.commit.length?'<p class="q" style="color:var(--muted);font-size:12px">Gli ultimi '+b.commit.length+' di '+b.totale+'.</p>':''):'<p style="color:var(--muted);font-size:13px">Nessun commit proprio: il ramo coincide con quello da cui è nato.</p>');
 det.hidden=false;lay.classList.add('aperto');
 try{history.replaceState(null,'','#repo='+S.r+'&ramo='+encodeURIComponent(b.nome))}catch(e){}}
function scegli(n,zoom){S.sel=n;if(S.v==='albero'&&zoom!==false)S.fuoco=n;dettagli();evidenzia();if(zoom!==false&&cam)vaiA(n)}
document.getElementById('det').addEventListener('click',function(e){var t=e.target.closest('[data-vai],[data-chiudi]');if(!t)return;
 if(t.dataset.chiudi!=null){S.sel=null;S.fuoco=null;try{history.replaceState(null,'',location.pathname)}catch(er){}dettagli();if(S.v==='albero')disegnaVista();else{evidenzia();if(cam)cam.anima(cam.tutto())}return}
 var n=t.dataset.vai;if(!X.keep[n]){S.sel=n;X=prepara()}if(S.v==='albero'){S.sel=n;S.fuoco=n;disegnaVista();dettagli()}else{disegnaVista();scegli(n)}});

/* ---------- Albero: il pallino entra nel ramo (zoom), la freccia apre e chiude ---------- */
function albero(){var radici=S.fuoco&&X.by[S.fuoco]?[S.fuoco]:X.R.radici,b0=S.fuoco&&X.by[S.fuoco];
 function rec(b,liv){var f=X.figli[b.nome]||[],c=colore(b),rad=X.R.radici.indexOf(b.nome)>=0,stato=rad?(b.nome==='main'?'Principale':'Sito pubblicato'):b.stato==='unito'?'Unito':b.stato==='attivo'?'Attivo':'Fermo';
  return '<li'+(liv>2&&!S.fuoco?' class="chiuso"':'')+'><div class="riga'+(b.nome===S.sel?' sel':'')+'" style="--c:'+c+'"><button type="button" class="pallino'+(b.stato==='attivo'||rad?'':' vuoto')+'" data-zoom="'+E(b.nome)+'" aria-label="Avvicina '+E(b.nome)+'">'+(f.length||'')+'</button>'+
   '<span class="t" data-info="'+E(b.nome)+'"><b>'+E(b.nome)+'</b><small>'+E(b.titolo)+' · '+giorno(b.data)+'</small></span><span class="chip'+(rad?' main':' '+b.stato)+'">'+stato+'</span>'+
   (f.length?'<button type="button" class="freccia" data-apri aria-label="Apri o chiudi i sotto-rami">▾</button>':'')+'</div>'+(f.length?'<ul>'+f.map(function(x){return rec(x,liv+1)}).join('')+'</ul>':'')+'</li>'}
 var bric='';if(b0){var cat=[],n=b0.nome;while(n){cat.unshift(n);n=X.by[n]&&X.by[n].padre}

 return '<h2>Albero</h2><p class="sub">Tocca un pallino per entrare in quel ramo: restano lui e i suoi sotto-rami, con i dettagli a fianco. Il numero nel pallino dice quanti sotto-rami ha. La freccia apre e chiude.</p>'+bric+'<div class="albero'+(b0?' zoom-in':'')+'"><ul>'+radici.map(function(n){return rec(X.by[n],0)}).join('')+'</ul></div>'}
