 '<div class="duel-head"><b>'+nm(a)+'</b><span>CONFRONTO</span><b>'+nm(b)+'</b></div>'+
 [['Posizione',ha?ha.pos+'ª':'—',hb?hb.pos+'ª':'—'],['Punti',stat(ha,'pt'),stat(hb,'pt')],['Gol fatti',stat(ha,'gf'),stat(hb,'gf')],['Gol subiti',stat(ha,'gs'),stat(hb,'gs')],['Differenza reti',ha?ha.gf-ha.gs:'—',hb?hb.gf-hb.gs:'—'],['Vittorie',stat(ha,'v'),stat(hb,'v')],['Pareggi',stat(ha,'n'),stat(hb,'n')],['Sconfitte',stat(ha,'p'),stat(hb,'p')]].map(function(x){return '<div class="duel-row"><strong>'+esc(x[1])+'</strong><span>'+x[0]+'</span><strong>'+esc(x[2])+'</strong></div>'}).join('')+'</aside>';

 document.getElementById('board').innerHTML=h;var u=new URL(location.href);u.searchParams.set('giornata',g.n);u.searchParams.set('partita',game);u.searchParams.set('skin',document.body.dataset.skin);history.replaceState(null,'',u);
